[project]
name = "spa-app"
version = "0.1.0"
description = ""
authors = [
    {name = "GalinaUm",email = "GalinaUmerzakhova@yandex.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.40.4,<0.41.0)",
    "redis (>=7.4.0,<8.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "ipython (>=9.12.0,<10.0.0)"
]

[tool.black]
target-version = ['py312']
line-length = 88
